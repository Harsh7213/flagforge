services:
  postgres:
    image: postgres:15-alpine
    container_name: feature_flags_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flaguser
      POSTGRES_PASSWORD: flagpass
      POSTGRES_DB: feature_flags
    ports:
      - '5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flaguser -d feature_flags']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: feature_flags_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flags.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
